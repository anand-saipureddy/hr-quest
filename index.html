<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>HR Quest</title>
<style>
:root{
  --brand:oklch(0.28 0.055 165);
  --brand-ink:oklch(0.97 0.012 165);
  --brand-ink-dim:oklch(0.80 0.02 165);
  --bg:oklch(0.975 0.005 165);
  --surface:oklch(0.995 0.003 165);
  --ink:oklch(0.24 0.028 165);
  --ink-muted:oklch(0.44 0.02 165);
  --line:oklch(0.90 0.008 165);
  --indigo:oklch(0.45 0.13 265);
  --indigo-wash:oklch(0.95 0.02 265);
  --action:oklch(0.51 0.185 32);
  --action-deep:oklch(0.45 0.17 32);

  --font-display:ui-serif,Georgia,"Times New Roman",serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r:10px;
  --dur-fast:120ms; --dur:200ms; --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.6 var(--font-ui);
  overflow-wrap:break-word;
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--indigo)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:4px}
.wrap{max-width:42rem;margin:0 auto;padding-inline:var(--s4)}
@media (min-width:60rem){.wrap{max-width:48rem}}

/* ---------- masthead: the one brand surface ---------- */
.mast{background:var(--brand);color:var(--brand-ink);padding-block:var(--s7) var(--s6)}
.mast h1{
  font-size:clamp(2.25rem,7vw,3.25rem);letter-spacing:-0.02em;color:var(--brand-ink);
}
.mast p{margin:var(--s3) 0 0;color:var(--brand-ink-dim);max-width:34ch;font-size:1.0625rem}
.counts{
  display:flex;flex-wrap:wrap;gap:var(--s5);margin-top:var(--s6);
  padding-top:var(--s5);border-top:1px solid oklch(0.40 0.04 165);
}
.count b{
  display:block;font:600 1.75rem/1 var(--font-display);
  font-variant-numeric:tabular-nums;color:var(--brand-ink)
}
.count span{display:block;margin-top:var(--s1);font-size:.8125rem;color:var(--brand-ink-dim)}

/* ---------- the single next action ---------- */
.next{margin-top:var(--s6)}
.next small{display:block;font-size:.8125rem;color:var(--brand-ink-dim);margin-bottom:var(--s2)}
.cta{
  display:inline-flex;align-items:center;min-height:48px;padding:var(--s3) var(--s5);
  background:var(--action);color:#fff;border:0;border-radius:var(--r);
  font-weight:600;text-decoration:none;cursor:pointer;
  transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);
}
.cta:hover{background:var(--action-deep)}
.cta:active{transform:scale(.98)}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:var(--s2);position:sticky;top:0;z-index:10;
  background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:var(--s4);margin-bottom:var(--s6)
}
.tabs button{
  flex:1;min-height:48px;padding:0 var(--s2);background:none;border:0;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  color:var(--ink-muted);font-weight:500;cursor:pointer;
  transition:color var(--dur-fast) var(--ease)
}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--action);font-weight:600}
@media (min-width:40rem){.tabs button{flex:none;padding-inline:var(--s5)}}
[role="tabpanel"][hidden]{display:none}

section{margin-bottom:var(--s7)}
section > h2{font-size:1.375rem;margin-bottom:var(--s2)}
.lede{color:var(--ink-muted);margin:0 0 var(--s5);max-width:65ch}

/* ---------- job rows ---------- */
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{
  display:flex;gap:var(--s4);align-items:flex-start;justify-content:space-between;
  padding:var(--s4) 0;border-bottom:1px solid var(--line)
}
.row-main{min-width:0;flex:1}
.row h3{font-family:var(--font-ui);font-size:1rem;font-weight:600;line-height:1.35}
.row h3 a{color:var(--ink);text-decoration:none}
.row h3 a:hover{text-decoration:underline;text-underline-offset:2px}
.row .co{margin:var(--s1) 0 0;font-size:.9375rem;color:var(--ink)}
.row .meta{margin:var(--s2) 0 0;font-size:.8125rem;color:var(--ink-muted)}
.chip{
  display:inline-block;margin-top:var(--s2);padding:2px var(--s2);border-radius:99px;
  font-size:.75rem;font-weight:600;
  color:var(--indigo);background:var(--indigo-wash);border:1px solid var(--indigo)
}
.chip.solid{background:var(--indigo);color:#fff}
.mark{
  min-height:44px;min-width:44px;padding:0 var(--s3);flex:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink-muted);font-size:.8125rem;font-weight:600;cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)
}
.mark:hover{border-color:var(--indigo);color:var(--indigo)}
.tags{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s2) 0 0}
.tag{
  padding:2px var(--s2);border-radius:99px;border:1px solid var(--line);
  font-size:.75rem;font-weight:600;color:var(--ink-muted);background:var(--bg);
  font-variant-numeric:tabular-nums
}
.tag.fit[data-tier="high"]{color:var(--brand);border-color:var(--brand);background:oklch(0.94 0.02 165)}
.tag.fit[data-tier="good"]{color:var(--brand);border-color:oklch(0.78 0.02 165)}

details{border-top:1px solid var(--line);margin-top:var(--s5)}
summary{
  min-height:48px;display:flex;align-items:center;cursor:pointer;
  font-weight:600;color:var(--ink-muted)
}
summary:hover{color:var(--ink)}

/* ---------- skills ---------- */
.track{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:var(--s5)}
.track > h3{font-size:1.125rem}
.drill{padding-top:var(--s5);margin-top:var(--s5);border-top:1px solid var(--line)}
.drill p.q{margin:0 0 var(--s4);font-weight:500}
.opts{display:grid;gap:var(--s2)}
.opt{
  display:block;width:100%;min-height:48px;padding:var(--s3) var(--s4);text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  cursor:pointer;transition:border-color var(--dur-fast) var(--ease),background var(--dur) var(--ease)
}
.opt:hover:not(:disabled){border-color:var(--ink-muted)}
.opt.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9375rem}
.opt:disabled{cursor:default}
.opt[data-state="right"]{border-color:var(--brand);background:oklch(0.94 0.02 165);font-weight:600}
.opt[data-state="wrong"]{border-color:var(--ink-muted);background:var(--bg);text-decoration:line-through}
.verdict{margin:var(--s4) 0 0;font-size:.9375rem;color:var(--ink-muted)}
.verdict b{color:var(--ink);font-family:var(--font-ui)}
.build{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line)}
.build ol{margin:var(--s4) 0 0;padding-left:1.25rem;color:var(--ink)}
.build li{margin-bottom:var(--s2)}
.locked{color:var(--ink-muted);font-size:.9375rem;margin:var(--s4) 0 0}
.track h4{font-family:var(--font-ui);font-size:1rem;font-weight:600;margin:0}
.setup{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line)}
.setup ol{margin:var(--s4) 0 0;padding-left:1.25rem}
.setup li{margin-bottom:var(--s2)}
.setup .why{margin:var(--s2) 0 0;color:var(--ink-muted);font-size:.9375rem}
.setup .note{margin:var(--s3) 0 0;color:var(--ink-muted);font-size:.875rem}
.copy{
  display:inline-flex;align-items:center;min-height:48px;margin-top:var(--s4);
  padding:0 var(--s5);background:var(--brand);color:var(--brand-ink);
  border:0;border-radius:var(--r);font-weight:600;cursor:pointer
}
.copy:active{transform:scale(.98)}
details.plain{border-top:0;margin-top:var(--s3)}
details.plain summary{min-height:44px;font-size:.875rem}
pre.data{
  margin:var(--s2) 0 0;padding:var(--s3);max-height:12rem;overflow:auto;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  font-size:.75rem;line-height:1.5;white-space:pre
}
.build .note{margin:var(--s3) 0 0;color:var(--ink-muted);font-size:.875rem;font-weight:600}
.check{margin:var(--s2) 0 0;padding:0;list-style:none;font-size:.9375rem;color:var(--ink-muted)}
.check li{position:relative;padding-left:1.25rem;margin-bottom:var(--s2)}
.check li::before{
  content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;
  background:var(--ink-muted);border-radius:50%
}

.quiet{color:var(--ink-muted)}
footer{border-top:1px solid var(--line);padding-block:var(--s6) var(--s8);margin-top:var(--s7)}
footer p{margin:var(--s4) 0 0;font-size:.8125rem;color:var(--ink-muted);max-width:60ch}
.ghost{
  display:inline-flex;align-items:center;min-height:48px;padding:0 var(--s5);
  background:none;border:1px solid var(--ink-muted);border-radius:var(--r);
  color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer
}
.ghost:hover{border-color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <h1>HR Quest</h1>
    <p>Chennai HR openings, refreshed every morning. And the software skills they screen for.</p>
    <div class="counts" id="counts"></div>
    <div class="next">
      <small>Next</small>
      <button class="cta" id="cta" type="button"></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-jobs"   aria-controls="panel-jobs"   aria-selected="true">Jobs</button>
    <button role="tab" id="tab-skills" aria-controls="panel-skills" aria-selected="false" tabindex="-1">Skills</button>
    <button role="tab" id="tab-study"  aria-controls="panel-study"  aria-selected="false" tabindex="-1">Study</button>
  </div>

  <div role="tabpanel" id="panel-jobs" aria-labelledby="tab-jobs" tabindex="0"></div>
  <div role="tabpanel" id="panel-skills" aria-labelledby="tab-skills" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-study" aria-labelledby="tab-study" tabindex="0" hidden></div>

  <footer>
    <button class="ghost" id="share" type="button" aria-live="polite">Copy my progress</button>
    <p id="storage-note">Everything you do here stays on this device. Nothing is ever sent anywhere. The button copies a line of text to your clipboard — what you do with it is up to you.</p>
  </footer>
</div>

ernship","location":"Chennai","posted":"2026-08-10","salary":"Unpaid","exp":"0-1 Yrs","src":"naukri","fit":42,"firstSeen":"2026-08-14","isNew":true}],"skills":[{"id":"excel","name":"Excel / Google Sheets","short":"Excel","blurb":"The one tool every HR job description asks for and almost no fresher can actually demonstrate.","setup":{"title":"Make the practice sheet first","cta":"Make the Excel practice sheet","why":"The three questions below are about a real sheet, not an imaginary one. Build it once and you can try every formula yourself instead of guessing.","steps":["Open a new Google Sheet — type sheets.new in your browser address bar.","Click cell A1.","Tap Copy the 20 rows below, then paste. Sheets splits it into columns on its own.","You should end up with headers in row 1 and candidates in rows 2 to 21."],"copyLabel":"Copy the 20 rows","note":"Column A is Candidate ID, B is Name, C is City, D is Role applied, E is Status, F is Interview score.","data":"Candidate ID\tName\tCity\tRole applied\tStatus\tInterview score\nC1001\tAarthi Balaji\tChennai\tHR Executive\tShortlisted\t7\nC1002\tRavi Kumar\tCoimbatore\tHR Executive\tRejected\t4\nC1003\tDivya Menon\tChennai\tRecruiter\tShortlisted\t8\nC1004\tSanjay Iyer\tBengaluru\tRecruiter\tIn review\t6\nC1005\tPriya Nair\tChennai\tHR Trainee\tShortlisted\t9\nC1006\tKarthik Raja\tMadurai\tHR Trainee\tRejected\t3\nC1007\tMeena Suresh\tChennai\tHR Executive\tIn review\t7\nC1008\tArun Prasad\tChennai\tRecruiter\tShortlisted\t8\nC1009\tLakshmi Ganesan\tCoimbatore\tHR Trainee\tIn review\t5\nC1010\tVignesh Mohan\tChennai\tHR Executive\tRejected\t4\nC1011\tSneha Reddy\tHyderabad\tRecruiter\tIn review\t6\nC1012\tBharath Kumar\tChennai\tHR Trainee\tShortlisted\t8\nC1013\tAnitha Raman\tChennai\tRecruiter\tRejected\t5\nC1014\tGokul Krishnan\tSalem\tHR Executive\tIn review\t6\nC1015\tDeepa Shankar\tChennai\tHR Executive\tShortlisted\t9\nC1016\tNaveen Kumar\tBengaluru\tHR Trainee\tRejected\t4\nC1017\tSwathi Venkat\tChennai\tRecruiter\tIn review\t7\nC1018\tManoj Pillai\tChennai\tHR Trainee\tShortlisted\t8\nC1019\tRamya Krishnan\tCoimbatore\tHR Executive\tIn review\t6\nC1020\tHari Prasad\tChennai\tRecruiter\tRejected\t5"},"drills":[{"q":"Your manager asks how many of the 20 candidates are in Chennai. Column C is City. Type one of these into cell H1 — which one answers the question?","teach":"COUNTIF takes two things: the range to look in, and the condition to match. =COUNTIF(where, what). The condition goes in quotes when it is text. The other three functions here count or add cells without checking any condition at all — COUNT only counts numbers, COUNTA counts anything non-empty, SUM adds numbers up.","options":["=COUNT(C2:C21)","=COUNTIF(C2:C21, \"Chennai\")","=SUM(C2:C21)","=COUNTA(C2:C21)"],"answer":1,"why":"You should get 12. COUNT returns 0 here because column C holds text, not numbers; COUNTA returns 20 because every cell is filled; SUM returns 0. COUNTIF is the only one that asks a question about each cell."},{"q":"You paste =VLOOKUP(\"C1043\", A2:F21, 2, FALSE) into H2. There is no C1043 in your sheet — you only have C1001 to C1020. What appears in the cell?","teach":"VLOOKUP searches the first column of a range for a value, then returns something from the same row. The last argument FALSE means 'exact match only'. Try it in your sheet: first with C1005 (it works, you get a name), then with C1043.","options":["0","An empty cell","#N/A","The closest match it can find"],"answer":2,"why":"#N/A is Sheets saying 'no match'. It looks like a broken sheet to whoever opens it, so wrap it: =IFERROR(VLOOKUP(\"C1043\", A2:F21, 2, FALSE), \"Not found\"). Do that before you send any sheet to a manager."},{"q":"You keep the VLOOKUP from the last question. Now someone inserts a new column between Name and City. Your formula still says column 2. What happens, and which approach survives it?","teach":"VLOOKUP's third argument is a position — 'give me the 2nd column of the range'. It is counting, not reading headers. INDEX+MATCH splits the job in two: MATCH finds which row, INDEX pulls the value from a column you point at directly. Try it: =INDEX(B2:B21, MATCH(\"C1005\", A2:A21, 0)).","options":["VLOOKUP is fine — the range reference updates automatically","INDEX+MATCH survives, because it points at the column itself instead of counting positions","Both break, there is no way around it","VLOOKUP is fine as long as the last argument is FALSE"],"answer":1,"why":"The range does shift, but the number 2 does not — it now means whatever column happens to sit second, so you get the wrong data with no error to warn you. That silent-wrong-answer is why INDEX+MATCH (or XLOOKUP) is what people use on sheets that other people edit."}],"build":{"title":"A 20-person attendance tracker","brief":"Same file, new tab. Turn the candidate sheet into something an HR team would actually run: daily attendance for 20 employees over one month, with each person's total worked out by the sheet, not by you.","steps":["Rename your current tab to Employees. Reuse the 20 rows — Candidate ID becomes Employee ID.","Add a second tab called Attendance: Employee ID, Date, Status. Put P, A or L in Status.","Fill about a week of dates for all 20 people. Copy-paste is fine — you are practising formulas, not typing.","Back on Employees, add a Days present column: =COUNTIFS(Attendance!A:A, A2, Attendance!C:C, \"P\").","Add a Department column to Attendance that fills itself from Employees with INDEX+MATCH or XLOOKUP.","Conditional formatting: highlight any row where Days present is under 4.","Freeze the header row on both tabs and name every tab properly."],"check":["Change one P to an A. The Days present number should drop on its own.","Add a 21st employee. The formulas should keep working without you editing them.","Nothing in the Days present column was typed by hand."],"doneLabel":"I built this"}},{"id":"genai","name":"Generative AI for HR","short":"AI","blurb":"Every HR team is being asked to use AI this year. Knowing what to hand it — and what never to hand it — is the actual skill.","setup":{"title":"Open a tool and run one real prompt","cta":"Run your first AI prompt","why":"The questions below are about what comes back, so you need something to come back. This takes two minutes and the answer you get is the answer the questions talk about.","steps":["Open any free AI tool — gemini.google.com, chatgpt.com or claude.ai. A free account is enough.","Tap Copy the prompt below and paste it in.","Read what it gives you. Keep the tab open — the third question asks you to check one line of it.","Then try deleting the last two lines of the prompt and running it again. Notice how much worse it gets."],"copyLabel":"Copy the prompt","note":"The prompt names the role, the company type, the city, the must-haves, the tone and the length. Those six things are what makes it work.","data":"Write a job description for an HR Trainee at a 60-person IT services company in Chennai.\nMust-haves: MBA in HR, 0-1 years, comfortable with Google Sheets, spoken English and Tamil.\nDay-to-day: scheduling interviews, maintaining the candidate tracker, onboarding paperwork, attendance records.\nTone: plain and warm, not corporate. No buzzwords like rockstar, ninja or fast-paced.\nLength: under 250 words, with a short bulleted responsibilities list.\nDo not invent salary, benefits or any legal requirement. If you are unsure of something, leave it out."},"drills":[{"q":"You need a job description for an HR Trainee. Which of these gets you something you could actually send to a manager?","teach":"A vague prompt makes the AI guess, and it guesses generically — you get the same paragraph everyone else gets. A useful prompt pins down six things: the role, the company, the location, the must-haves, the tone, and the length. The prompt you just pasted has all six. That is why it produced something specific.","options":["\"Write a job description for an HR Trainee.\"","\"Write a job description. Make it professional and attractive to candidates.\"","\"You are an expert world-class HR leader with 20 years of experience. Write an amazing JD.\"","The prompt you just ran — role, company size, city, must-haves, tone, length, and a rule about not inventing things"],"answer":3,"why":"Piling on flattery — 'world-class', '20 years of experience' — changes almost nothing. Concrete constraints change everything. The last line matters most: telling it not to invent salary or legal details is what stops the confident-sounding fiction."},{"q":"A manager forwards you 12 CVs and asks you to use AI to shortlist them. What do you do first?","teach":"A CV is someone else's personal data — name, phone, address, sometimes date of birth. Pasting it into a public AI tool sends it to a company your employer has no agreement with, and you cannot get it back. Most HR teams have a rule about this, and 'I did not know' is not a defence in an audit.","options":["Paste all 12 in at once and ask it to rank them","Paste them one at a time so it is less data","Ask whether the company allows it, and strip names and contact details before pasting anything","Screenshot them instead of pasting the text"],"answer":2,"why":"One at a time and screenshots are the same disclosure, just slower. Ask first; if it is allowed, remove the identifying details and paste only the experience and skills. If your company has an approved internal tool, use that instead — that is what it is for."},{"q":"The job description it wrote for you includes a line about statutory leave entitlement in Tamil Nadu, stated very confidently. You did not ask for it. What do you do?","teach":"These tools produce fluent text, not verified text. They will state a leave rule, a notice period or a PF threshold in the same steady voice they use for everything else, and be wrong. The tell is confidence about a specific number you did not supply.","options":["Leave it in — it sounded specific, so it is probably from a real source","Ask the AI 'are you sure?' and keep it if it says yes","Cut it, or verify it against the actual rule or with someone senior before it goes anywhere near a candidate","Rewrite it more vaguely so it is harder to be wrong"],"answer":2,"why":"'Are you sure?' just makes it apologise and often invent a different number. Anything with a legal or money consequence gets cut or checked against a real source. Being the fresher who caught it is a much better look than being the one who published it."}],"build":{"title":"A three-piece hiring kit for one role","brief":"Take the HR Trainee role from the setup and produce the three documents an HR executive actually gets asked for. Use AI for the first draft, then edit it — the edit is the part that shows you know what you are doing.","steps":["Job description: start from what you already generated. Cut anything invented, and cut every buzzword that survived.","Five screening questions for a 10-minute phone call, each with a note on what a good answer sounds like.","A rejection email — short, warm, no false promises about 'keeping your CV on file' unless you actually will.","Put all three in one Google Doc with headings, and name it properly.","At the bottom, add a short section: 'What I changed from the AI draft, and why.'","Keep the prompts you used. Being able to show your prompt is part of the skill."],"check":["That last section is not empty — if you changed nothing, you did not read it closely enough.","No number, date or legal claim in the document that you cannot point to a source for.","No real candidate's name or contact details anywhere in it."],"doneLabel":"I built this"}}],"modules":[]};

/* ---------- state: one versioned key, only ever grows ---------- */
const KEY = 'hrq.v1';
const blank = { lessons:{}, skills:{}, jobs:{}, counters:{lessons:0, skills:0, applied:0} };
let memoryOnly = false;
let S;
try {
  S = Object.assign({}, blank, JSON.parse(localStorage.getItem(KEY) || '{}'));
  localStorage.setItem(KEY, JSON.stringify(S));
} catch (e) {
  S = structuredClone(blank);
  memoryOnly = true;
}
function save(){
  if (memoryOnly) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memoryOnly = true; }
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = id => document.getElementById(id);
const day = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';

/* ---------- masthead ---------- */
function renderCounts(){
  const c = S.counters;
  el('counts').innerHTML = [
    [c.lessons, c.lessons === 1 ? 'module done' : 'modules done'],
    [c.skills,  c.skills  === 1 ? 'skill built' : 'skills built'],
    [c.applied, c.applied === 1 ? 'application' : 'applications'],
  ].map(([n,l]) => `<div class="count"><b>${n}</b><span>${l}</span></div>`).join('');
}

/* ---------- the one next action ---------- */
function nextAction(){
  for (const sk of DATA.skills){
    const st = S.skills[sk.id] || {drills:[], built:false};
    const i = sk.drills.findIndex((_,n) => !st.drills[n]);
    const name = sk.short || sk.name;
    // the first step is making the thing the questions are about, not answering one
    if (i === 0 && sk.setup?.cta) return { label: sk.setup.cta, tab:'skills' };
    if (i > -1) return { label:`${name} drill ${i+1} of ${sk.drills.length}`, tab:'skills' };
    if (!st.built) return { label:`Open the ${name} task`, tab:'skills' };
  }
  const m = DATA.modules.find(m => !(S.lessons[m.id]||{}).done);
  if (m) return { label:`Start the ${m.title} quiz`, tab:'study' };
  const n = DATA.jobs.filter(j => j.isNew && !S.jobs[j.id]).length;
  return { label: n ? `Look at ${n} new opening${n===1?'':'s'}` : 'Check your applications', tab:'jobs' };
}
function renderCta(){
  const a = nextAction();
  const b = el('cta');
  b.textContent = a.label;
  b.onclick = () => { selectTab(a.tab); document.getElementById('panel-'+a.tab).scrollIntoView({behavior:'smooth',block:'start'}); };
}

/* ---------- jobs ---------- */
const BOARD = { naukri:'Naukri', internshala:'Internshala', linkedin:'LinkedIn', indeed:'Indeed' };
function jobRow(j){
  const st = S.jobs[j.id];
  const chip = !st ? ''
    : st.replied ? '<span class="chip solid">Replied</span>'
    : `<span class="chip">Applied ${day(st.applied)}</span>`;
  const btn = !st
    ? `<button class="mark" data-act="apply" data-id="${j.id}">I applied</button>`
    : !st.replied
      ? `<button class="mark" data-act="reply" data-id="${j.id}">They replied</button>`
      : '';
  const tier = j.fit >= 85 ? 'high' : j.fit >= 70 ? 'good' : 'ok';
  const pay = j.salary ? ` &middot; ${esc(j.salary)}` : '';
  return `<li class="row"><div class="row-main">
      <h3><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h3>
      <p class="co">${esc(j.company)}</p>
      <p class="meta">${esc(j.location)}${pay}</p>
      <p class="tags">
        <span class="tag">${esc(BOARD[j.src] || j.src)}</span>
        <span class="tag fit" data-tier="${tier}">${j.fit}% match</span>
      </p>
      ${chip}
    </div>${btn}</li>`;
}
function renderJobs(){
  const applied = DATA.jobs.filter(j => S.jobs[j.id]);
  const open    = DATA.jobs.filter(j => !S.jobs[j.id]);
  const fresh   = open.filter(j => j.isNew).slice(0, DATA.newCap);
  const rest    = open.filter(j => !fresh.includes(j));

  const list = rows => `<ul class="rows">${rows.map(jobRow).join('')}</ul>`;
  let html = '<section><h2>New today</h2>';
  html += fresh.length
    ? `<p class="lede">${fresh.length} opening${fresh.length===1?'':'s'} for a fresher HR profile in Chennai. The percentage is how closely the posting matches that — a rough sort, not a verdict, so read a 62% if the company interests you. The other tag is the board it came from. Tap “I applied” only when you actually have.</p>${list(fresh)}`
    : '<p class="lede">Nothing new since your last look. The list refreshes every morning.</p>';
  if (rest.length) html += `<details><summary>More matches (${rest.length})</summary>${list(rest)}</details>`;
  html += '</section>';

  html += '<section><h2>My applications</h2>';
  html += applied.length
    ? `<p class="lede">These stay here so you can chase a reply.</p>${list(applied)}`
    : '<p class="lede">Nothing yet. Anything you mark as applied stays on this list.</p>';
  html += '</section>';
  el('panel-jobs').innerHTML = html;
}

/* ---------- skills ---------- */
function renderSkills(){
  el('panel-skills').innerHTML = DATA.skills.map(sk => {
    const st = S.skills[sk.id] || {drills:[], built:false};
    const done = sk.drills.every((_,n) => st.drills[n]);
    const drills = sk.drills.map((d,i) => {
      const picked = st.drills[i];
      const opts = d.options.map((o,n) => {
        const state = !picked ? '' : n === d.answer ? ' data-state="right"' : (picked.pick === n ? ' data-state="wrong"' : '');
        // a formula is easier to read in a monospaced face — brackets and quotes line up
        const mono = /^=/.test(o) ? ' mono' : '';
        return `<button class="opt${mono}"${state}${picked?' disabled':''} data-skill="${sk.id}" data-drill="${i}" data-opt="${n}">${esc(o)}</button>`;
      }).join('');
      const verdict = picked
        ? `<p class="verdict"><b>${picked.pick === d.answer ? 'Correct.' : 'Not quite.'}</b> ${esc(d.why)}</p>` : '';
      const teach = d.teach
        ? `<details class="plain"><summary>Show me how this works</summary><p class="verdict" style="margin-top:0">${esc(d.teach)}</p></details>` : '';
      return `<div class="drill"><p class="q">${i+1}. ${esc(d.q)}</p>${teach}<div class="opts">${opts}</div>${verdict}</div>`;
    }).join('');
    const su = sk.setup;
    const setup = su
      ? `<div class="setup"><h4>${esc(su.title)}</h4>
         ${su.why ? `<p class="why">${esc(su.why)}</p>` : ''}
         <ol>${su.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
         ${su.data ? `<button class="copy" data-act="copy" data-skill="${sk.id}">${esc(su.copyLabel || 'Copy')}</button>
           <details class="plain"><summary>Or read it here and type it in</summary><pre class="data">${esc(su.data)}</pre></details>` : ''}
         ${su.note ? `<p class="note">${esc(su.note)}</p>` : ''}
        </div>`
      : '';
    const checks = sk.build.check
      ? `<p class="note" style="margin-top:var(--s5)">How you know it worked</p>
         <ul class="check">${sk.build.check.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : '';
    const build = done
      ? `<div class="build"><h3>${esc(sk.build.title)}</h3><p class="lede">${esc(sk.build.brief)}</p>
         <ol>${sk.build.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
         ${checks}
         ${st.built
            ? '<p class="verdict"><b>Done.</b> It stays counted whatever happens next.</p>'
            : `<p style="margin-top:var(--s5)"><button class="cta" data-act="built" data-skill="${sk.id}">${esc(sk.build.doneLabel || 'I built this')}</button></p>`}
        </div>`
      : `<div class="build"><h3>${esc(sk.build.title)}</h3><p class="locked">The three drills above open this up. It is the piece you can actually put on a CV.</p></div>`;
    return `<section><div class="track"><h3>${esc(sk.name)}</h3><p class="lede" style="margin-bottom:0">${esc(sk.blurb)}</p>${setup}${drills}${build}</div></section>`;
  }).join('');
}

/* ---------- study ---------- */
function renderStudy(){
  if (!DATA.modules.length){
    el('panel-study').innerHTML =
      `<section><h2>Coursera modules</h2>
       <p class="lede">Nothing to check yet. A recap and a set of questions appear here as each module of the specialization is added.</p>
       <p class="quiet">The page never teaches you the material — it only checks what stuck.</p></section>`;
    return;
  }
  el('panel-study').innerHTML = DATA.modules.map(m => {
    const st = S.lessons[m.id] || {};
    return `<section><h2>${esc(m.title)}</h2>
      <ul class="rows">${m.recap.map(r => `<li class="row"><div class="row-main">${esc(r)}</div></li>`).join('')}</ul>
      ${st.done ? `<p class="verdict"><b>Done.</b> You scored ${st.score}.</p>` : ''}</section>`;
  }).join('');
}

/* ---------- copy: no recipient, no network, hers to do nothing with ---------- */
function progressText(){
  const c = S.counters;
  return `${c.lessons} module${c.lessons===1?'':'s'} done, ${c.skills} skill${c.skills===1?'':'s'} built, ${c.applied} application${c.applied===1?'':'s'} sent.`;
}
async function copyText(btn, text){
  const label = btn.textContent;
  const restore = () => setTimeout(() => { btn.textContent = label; }, 2000);
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {                                   // older Android webviews
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    if (!done){ btn.textContent = 'Could not copy — open the list below'; restore(); return; }
  }
  btn.textContent = 'Copied';
  restore();
}
el('share').addEventListener('click', () => copyText(el('share'), progressText()));

/* ---------- tabs ---------- */
const TABS = ['jobs','skills','study'];
function selectTab(name){
  TABS.forEach(t => {
    const on = t === name;
    const b = el('tab-'+t);
    b.setAttribute('aria-selected', on);
    b.tabIndex = on ? 0 : -1;
    el('panel-'+t).hidden = !on;
  });
  history.replaceState(null, '', '#' + name);
}
TABS.forEach(t => el('tab-'+t).addEventListener('click', () => selectTab(t)));
el('tab-jobs').parentElement.addEventListener('keydown', e => {
  const i = TABS.indexOf(document.activeElement.id.replace('tab-',''));
  if (i < 0) return;
  const n = e.key === 'ArrowRight' ? i+1 : e.key === 'ArrowLeft' ? i-1 : -1;
  if (n < 0) return;
  e.preventDefault();
  const t = TABS[(n + TABS.length) % TABS.length];
  selectTab(t); el('tab-'+t).focus();
});

/* ---------- one delegated click handler ---------- */
document.addEventListener('click', e => {
  const opt = e.target.closest('.opt');
  if (opt){
    const st = S.skills[opt.dataset.skill] ||= {drills:[], built:false};
    st.drills[+opt.dataset.drill] = { pick: +opt.dataset.opt };
    save(); renderSkills(); renderCta();
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'copy'){                  // practice data — nothing to remember
    copyText(b, DATA.skills.find(s => s.id === b.dataset.skill).setup.data);
    return;
  }
  if (b.dataset.act === 'apply'){
    S.jobs[b.dataset.id] = { applied: DATA.builtAt, replied: false };
    S.counters.applied++;
  } else if (b.dataset.act === 'reply'){
    S.jobs[b.dataset.id].replied = true;
  } else if (b.dataset.act === 'built'){
    S.skills[b.dataset.skill].built = true;
    S.counters.skills++;
  }
  save(); render();
});

function render(){ renderCounts(); renderCta(); renderJobs(); renderSkills(); renderStudy(); }
render();
if (memoryOnly) el('storage-note').textContent =
  'This browser will not let the page remember anything, so what you do here disappears when you close the tab. Everything still works.';
const hash = location.hash.slice(1);
if (TABS.includes(hash)) selectTab(hash);
</script>
